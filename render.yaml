# Render Blueprint — defines the entire deploy declaratively.
# When you connect this repo to a new Blueprint on Render, this file is
# auto-detected and the service + disk are created for you.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mandate
    runtime: docker
    plan: free                 # Bump to 'starter' ($7/mo) for always-on; free spins down after 15min idle.
    region: oregon             # Change to 'frankfurt' / 'singapore' / 'ohio' / 'virginia' if closer.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true           # Re-deploy on every push to main.

    # Persistent disk for the SQLite file. The container writes to /data/mandate.db.
    disk:
      name: mandate-data
      mountPath: /data
      sizeGB: 1                # 1 GB easily holds tens of millions of records.

    envVars:
      # Render injects PORT automatically; the Dockerfile reads it.
      - key: NODE_ENV
        value: production
      - key: MANDATE_DB
        value: /data/mandate.db
      - key: MANDATE_SERVE_STATIC
        value: "1"
      - key: MANDATE_FORCE_SECURE_COOKIES
        value: "1"             # Render terminates TLS in front of us.
      - key: MANDATE_EMAIL_BACKEND
        value: console         # Switch to 'resend' or 'smtp' once you wire a real backend.
      - key: MANDATE_EMAIL_FROM
        value: Mandate <noreply@example.com>
      # Add this in the Render dashboard (don't commit secrets to the repo):
      # - key: MANDATE_RESEND_KEY
      #   sync: false

  # ── Starbase (starbase/) — the field-first campaign OS ─────────────────
  # Web service + managed Postgres. After the first deploy, set the secrets
  # marked sync:false in the Render dashboard (email, SMS, Stripe).
  - type: web
    name: starbase
    runtime: docker
    plan: starter              # always-on; volunteers canvass at all hours
    region: oregon
    dockerfilePath: ./starbase/Dockerfile
    dockerContext: ./starbase
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starbase-db
          property: connectionString
      - key: STARBASE_PUBLIC_URL     # your public address, e.g. https://starbase.imaginesurrey.ca
        sync: false
      - key: RESEND_API_KEY          # email: newsletters, press, invites, shift alerts
        sync: false
      - key: MAIL_FROM               # e.g. Imagine Surrey <team@imaginesurrey.ca>
        sync: false
      - key: TWILIO_ACCOUNT_SID      # SMS shift alerts
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: STRIPE_SECRET_KEY       # card donations (leave unset to take pledges)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET   # from the Stripe webhook pointing at /api/public/stripe/webhook
        sync: false

databases:
  - name: starbase-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
